<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ponte en contacto con Tripwise para consultas y dudas.">
    <title>Tripwise - Contacto</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <header>
        <nav>
            <h2>TripWise</h2>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="destinos.html">Destinos</a></li>
                <li><a href="planificador.html">Planificador</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
                <li><a href="cotizador.html">Cotizador</a></li>
            </ul>
        </nav>
    </header>

    <main class="container mt-5">
        <h1 class="text-center mb-4">Contáctanos</h1>
        <form class="custom-form shadow-sm p-4">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre"
                   aria-label="Campo para ingresar tu nombre" required>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="tuemail@ejemplo.com"
                   aria-label="Campo para ingresar tu correo electrónico" required>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..."
                      aria-label="Campo para escribir tu mensaje" required></textarea>

            <button type="submit" class="btn-primary-custom mt-3"
                    aria-label="Botón para enviar el formulario">Enviar</button>
        </form>
    </main>

    <footer>
        <p>© 2026 Tripwise Todos los derechos reservados</p>
    </footer>
</body>
</html>
