<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cotiza tu presupuesto de viaje al instante.">
    <title>Tripwise - Cotizador</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <header>
        <nav>
            <h2>TripWise</h2>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="destinos.html">Destinos</a></li>
                <li><a href="planificador.html">Planificador</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="cotizador.html" class="active">Cotizador</a></li>
            </ul>
        </nav>
    </header>

    <main class="container mt-5">
        <h1 class="text-center mb-4">Cotiza tu viaje</h1>
        <form class="custom-form shadow-sm p-4">
            <label for="dias">Duración del viaje (días):</label>
            <input type="number" id="dias" name="dias" min="1" required>

            <label for="costo-dia">Costo estimado por día (USD):</label>
            <input type="number" id="costo-dia" name="costo-dia" min="50" step="10" required>

            <label for="personas">Número de personas:</label>
            <input type="number" id="personas" name="personas" min="1" required>

            <button type="submit" class="btn-primary-custom mt-3">Calcular presupuesto</button>
        </form>

        <section class="resultado mt-5 text-center">
            <h2>Resultado</h2>
            <p>El presupuesto estimado aparecerá aquí.</p>
        </section>
    </main>

    <footer>
        <p>© 2026 Tripwise Todos los derechos reservados</p>
    </footer>
</body>
</html>
