<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripWise - Planificador</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="destinos.html">Destinos</a></li>
        <li><a href="planificador.html" class="active">Planificador</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="cotizador.html">Cotizador</a></li>
      </ul>
    </nav>
  </header>

  <main class="planificador">
    <h1>Planifica tu viaje</h1>
    <form class="form-planificador">
      <label for="destino">Destino:</label>
      <input type="text" id="destino" name="destino" placeholder="Ej: París" required>

      <label for="fecha">Fecha de inicio:</label>
      <input type="date" id="fecha" name="fecha" required>

      <label for="dias">Duración (días):</label>
      <input type="number" id="dias" name="dias" min="1" required>

      <label for="presupuesto">Presupuesto estimado (USD):</label>
      <input type="number" id="presupuesto" name="presupuesto" min="100" step="50" required>

      <button type="submit">Generar itinerario</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 TripWise - Todos los derechos reservados</p>
  </footer>
</body>
</html>
