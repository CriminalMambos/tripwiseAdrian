<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Planifica tu próximo viaje fácilmente con Tripwise.">
    <title>Tripwise - Planificador</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <header>
        <nav>
            <h2>TripWise</h2>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="destinos.html">Destinos</a></li>
                <li><a href="planificador.html" class="active">Planificador</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="cotizador.html">Cotizador</a></li>
            </ul>
        </nav>
    </header>

    <main class="container mt-5">
        <h1 class="text-center mb-4">Planifica tu viaje</h1>
        <form class="custom-form shadow-sm p-4">
            <label for="destino">Destino:</label>
            <input type="text" id="destino" name="destino" placeholder="Ej: París"
                   aria-label="Campo para ingresar destino del viaje" required>

            <label for="fecha">Fecha de inicio:</label>
            <input type="date" id="fecha" name="fecha"
                   aria-label="Campo para seleccionar fecha de inicio" required>

            <label for="dias">Duración (días):</label>
            <input type="number" id="dias" name="dias" min="1"
                   aria-label="Campo para ingresar duración en días" required>

            <label for="presupuesto">Presupuesto estimado (USD):</label>
            <input type="number" id="presupuesto" name="presupuesto" min="100" step="50"
                   aria-label="Campo para ingresar presupuesto estimado en dólares" required>

            <button type="submit" class="btn-primary-custom mt-3"
                    aria-label="Botón para generar itinerario">Generar itinerario</button>
        </form>
    </main>

    <footer>
        <p>© 2026 Tripwise Todos los derechos reservados</p>
    </footer>
</body>
</html>
